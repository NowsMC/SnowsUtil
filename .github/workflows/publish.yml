name: Publish Maven artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify release tag
        run: |
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "Publishing requires a v-prefixed tag." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ || "$version" == *SNAPSHOT* ]]; then
            echo "Release tag must contain a valid Maven release version." >&2
            exit 1
          fi
          project_version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          print(ET.parse("pom.xml").getroot().find("m:version", ns).text)
          PY
          )"
          if [[ "$project_version" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the pom version $project_version." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "The tagged commit is not on main." >&2
            exit 1
          fi

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            /^## / {
              if (found) exit
              if ($2 == version) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG.md section found for $version." >&2
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

      - name: Build and test before publishing
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "GPG_PRIVATE_KEY secret is required." >&2
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Test GPG signing
        id: gpg-test
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [[ -z "$GPG_KEY_ID" ]]; then
            echo "GPG_KEY_ID secret is required." >&2
            exit 1
          fi
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          printf 'SnowsUtil signing check\n' > "$temp_dir/payload"
          if [[ -n "$MAVEN_GPG_PASSPHRASE" ]]; then
            printf '%s\n' "$MAVEN_GPG_PASSPHRASE" |
              gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --local-user "$GPG_KEY_ID" --detach-sign \
                --output "$temp_dir/signature.asc" "$temp_dir/payload"
          else
            gpg --batch --yes --local-user "$GPG_KEY_ID" --detach-sign \
              --output "$temp_dir/signature.asc" "$temp_dir/payload"
          fi
          fingerprint="$(
            gpg --batch --status-fd 1 --verify \
              "$temp_dir/signature.asc" "$temp_dir/payload" 2>/dev/null |
              awk '$2 == "VALIDSIG" {
                for (i = 3; i <= NF; i++)
                  if ((length($i) == 40 || length($i) == 64) && $i ~ /^[[:xdigit:]]+$/)
                    fingerprint = $i
                print toupper(fingerprint)
                exit
              }'
          )"
          if [[ -z "$fingerprint" ]]; then
            echo "GPG signing test did not return a verified fingerprint." >&2
            exit 1
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Check signing key authorization
        env:
          SIGNING_FINGERPRINT: ${{ steps.gpg-test.outputs.fingerprint }}
        run: |
          case "$SIGNING_FINGERPRINT" in
            B64B156379154E5B6C176D0D6157503BFCD109A4|F860FD4D277DFFEDE47028DC7311416EAA9848E4) ;;
            *) echo "GPG signing key is not authorized for publishing." >&2; exit 1 ;;
          esac

      - name: Configure publishing credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          names = ("CENTRAL_USERNAME", "CENTRAL_PASSWORD", "B2_KEY_ID", "B2_APPLICATION_KEY")
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required publishing secrets: " + ", ".join(missing))

          settings = ET.Element(
              "settings",
              {
                  "xmlns": "http://maven.apache.org/SETTINGS/1.2.0",
                  "xmlns:xsi": "http://www.w3.org/2001/XMLSchema-instance",
                  "xsi:schemaLocation": (
                      "http://maven.apache.org/SETTINGS/1.2.0 "
                      "https://maven.apache.org/xsd/settings-1.2.0.xsd"
                  ),
              },
          )
          servers = ET.SubElement(settings, "servers")
          central = ET.SubElement(servers, "server")
          ET.SubElement(central, "id").text = "central"
          ET.SubElement(central, "username").text = os.environ["CENTRAL_USERNAME"]
          ET.SubElement(central, "password").text = os.environ["CENTRAL_PASSWORD"]

          profiles = ET.SubElement(settings, "profiles")
          profile = ET.SubElement(profiles, "profile")
          ET.SubElement(profile, "id").text = "snowsutil-publish"
          properties = ET.SubElement(profile, "properties")
          ET.SubElement(properties, "keyID").text = os.environ["B2_KEY_ID"]
          ET.SubElement(properties, "applicationKey").text = os.environ["B2_APPLICATION_KEY"]

          active_profiles = ET.SubElement(settings, "activeProfiles")
          ET.SubElement(active_profiles, "activeProfile").text = "snowsutil-publish"

          path = Path.home() / ".m2" / "settings.xml"
          path.parent.mkdir(parents=True, exist_ok=True)
          ET.ElementTree(settings).write(path, encoding="utf-8", xml_declaration=True)
          path.chmod(0o600)
          PY

      - name: Publish to Backblaze B2
        env:
          SIGNING_FINGERPRINT: ${{ steps.gpg-test.outputs.fingerprint }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          -Prelease,b2-publish
          -Dgpg.keyname="$SIGNING_FINGERPRINT"
          -DskipTests
          deploy

      - name: Publish to Sonatype Central
        env:
          SIGNING_FINGERPRINT: ${{ steps.gpg-test.outputs.fingerprint }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          -Prelease,central-publish
          -Dgpg.keyname="$SIGNING_FINGERPRINT"
          -DskipTests
          deploy

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
          --verify-tag